name: Build

# Manual builds, for grabbing a binary off a branch without cutting a release.
# Releases stay in release.yml, triggered by pushing a v* tag.
#
# Note: GitHub only offers the "Run workflow" button for workflows present on
# the repository's DEFAULT branch. If this lives only on a feature branch, the
# button will not appear.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The Makefile stamps the version from `git describe --tags`, which
          # needs history and tags. The default shallow clone silently produces
          # a binary that reports itself as "dev".
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build ARM64 (RPi 5 / CM5 / LPi3H)
        run: make build-arm64

      - name: Show what was built
        run: ./nanoctl-linux-arm64 version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanoctl-linux-arm64-${{ github.ref_name }}
          path: nanoctl-linux-arm64
          if-no-files-found: error
