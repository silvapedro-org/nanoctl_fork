name: Preview

# Manual builds, published as a PRERELEASE so they can be fetched by URL the
# same way a real release is — useful for testing a branch on hardware without
# committing to a version number.
#
# Proper releases stay in release.yml, triggered by pushing a v* tag.
#
# Note: GitHub only offers the "Run workflow" button for workflows present on
# the repository's DEFAULT branch. If this lives only on a feature branch, the
# button will not appear.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Preview tag (default: preview-<run number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The Makefile stamps the version from `git describe --tags`, which
          # needs history and tags. The default shallow clone silently produces
          # a binary that reports itself as "dev".
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build ARM64 (RPi 5 / CM5 / LPi3H)
        run: make build-arm64

      - name: Show what was built
        run: ./nanoctl-linux-arm64 version

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('preview-{0}', github.run_number) }}
          name: "Preview ${{ inputs.tag || github.run_number }} (${{ github.ref_name }})"
          # Never surfaces as "Latest", and stays clearly separate from real
          # releases in the UI and the API.
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Preview build of `${{ github.ref_name }}` at ${{ github.sha }}.
            Not a release — built manually for hardware testing.
          files: |
            nanoctl-linux-arm64
