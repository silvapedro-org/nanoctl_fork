name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and attach the binary as a workflow artifact. Supply a tag
  # to cut an actual release instead.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as (e.g. v0.2.0). Leave empty to build an artifact only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The Makefile stamps the version from `git describe --tags`, which
          # needs history and tags. The default shallow clone silently produces
          # a binary that reports itself as "dev".
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build ARM64 (RPi 5 / CM5 / LPi3H)
        # Via the Makefile so the version/commit/date ldflags are applied. A bare
        # `go build` drops them and every release reports itself as "dev".
        run: make build-arm64

      - name: Show what was built
        run: ./nanoctl-linux-arm64 version

      - name: Upload artifact (manual build, no tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: nanoctl-linux-arm64
          path: nanoctl-linux-arm64
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            nanoctl-linux-arm64
          generate_release_notes: true
