name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The Makefile stamps the version from `git describe --tags`, which
          # needs history and tags. The default shallow clone silently produces
          # a binary that reports itself as "dev".
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build ARM64 (RPi 5 / CM5 / LPi3H)
        # Via the Makefile so the version/commit/date ldflags are applied. A bare
        # `go build` drops them and every release reports itself as "dev".
        run: make build-arm64

      - name: Show what was built
        # NOT ./nanoctl-linux-arm64 version — the runner is x86_64 and this is an
        # arm64 cross-build, so executing it fails with "Exec format error".
        # `go version -m` reads the embedded build info without running it, which
        # is what actually proves the ldflags landed.
        run: |
          file nanoctl-linux-arm64
          go version -m nanoctl-linux-arm64 | grep -E 'ldflags|^\s' || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nanoctl-linux-arm64
          generate_release_notes: true
